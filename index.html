<!doctype html>

<html>
  <head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1, user-scalable=no'>
    <meta name='mobile-web-app-capable' content='yes'>

    <title>Grafitti - WebGPU test</title>

    <style>
      html, body, #webgpu-canvas {
        height: 100%;
        width: 100%;
        margin: 0;
        border: 0;
        padding: 0;
        overflow: hidden;
      }
      #emoji-picker-container {
        position: absolute;
        box-sizing: border-box;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 2;
        padding: 0.25em;
        text-align: center;
      }
      #emoji-picker-container>button {
        font-family: "Noto Color Emoji", sans-serif;
        font-size: 2em;
        width: 2em;
        height: 2em;
        padding: 0.25em 0.3em;
        border-radius: 0.25em;
        background-position: center;
        background-repeat: no-repeat;
        background-size: 50%;
        transition: transform 0.25s ease-in-out;
      }

      #emoji-picker-container>button:hover {
        transform: scale(1.3);
      }
      #emoji-picker-container>button.selected {
        transform: scale(1.25);
      }
      emoji-picker {
        margin: auto;
        --emoji-font-family: "Noto Color Emoji", sans-serif
      }

      .tp-dfwv {
        z-index: 10;
      }

      .crosshairs {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        z-index: 5;
        margin: auto;
        pointer-events: none;
        background-image: url(./media/images/crosshairs.png);
        background-position: center;
        background-repeat: no-repeat;
        opacity: 66%;
      }

      .loading canvas {
        display: none;
      }

      .loading-splash {
        display: none;
        position: absolute;
        text-align: center;
        padding-top: 3em;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        z-index: 20;
        margin: auto;
        pointer-events: none;
        background-image: url(./media/images/spinner.gif);
        background-color: white;
        background-position: center;
        background-repeat: no-repeat;
      }

      .loading .loading-splash {
        display: block;
      }
    </style>

    <!-- Enables consistent looking emoji across platforms -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">

  </head>
  <body>
    <script type='module' src='https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js'></script>
    <div id='emoji-picker-container'>
      <button id='view-button'>👀</button>
      <button id='emoji-button'>😀</button>
      <button id='shoot-button'>🔫</button>
      <button id='erase-button'>🧽</button>
      <button id='clear-button'>💣</button>
      <emoji-picker emoji-version='18.0' style='display: none'></emoji-picker>
      <div>
        <input type="range" id="decalRotation" name="decalRotation" min="-180" max="180" step="15" value="0"/>
        <label for="decalRotation">Decal Rotation</label>
      </div>
    </div>

    <canvas id='webgpu-canvas'></canvas>
    <div class='loading-splash'>
      <h1>😄 Emoji Graffiti 🎨</h1>
      <h2>Loading...</h2>
    </div>
    <div class='crosshairs'></div>
    <script type='module' src='./dist/main.js'></script>
  </body>
</html>
