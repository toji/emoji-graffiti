<!doctype html>

<html>
  <head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1, user-scalable=no'>
    <meta name='mobile-web-app-capable' content='yes'>

    <title>Emoji Graffiti</title>

    <style>
      html, body, #webgpu-canvas {
        height: 100%;
        width: 100%;
        margin: 0;
        border: 0;
        padding: 0;
        overflow: hidden;
      }
      #emoji-picker-container {
        position: absolute;
        box-sizing: border-box;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 2;
        padding: 0.25em;
        text-align: center;
      }
      #emoji-picker-container>button {
        position: relative;
        cursor: pointer;
        font-family: "Noto Color Emoji", sans-serif;
        font-size: 2em;
        width: 2.25em;
        height: 2.25em;
        padding: 0.5em;
        margin: 0.2em;
        border-radius: 0.5em;
        border: 0px;
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
        transition: transform 0.25s ease-in-out;
      }
      #view-button {
        background-color: hsl(191, 44%, 60%);
        background-image: url(media/images/walk.svg);
      }
      #emoji-button {
        background-color: hsl(39, 90%, 60%);
        background-image: url(media/images/spray.svg);
      }
      #shoot-button {
        background-color: hsl(161, 40%, 57%);
        background-image: url(media/images/paintball.svg);
      }
      #erase-button {
        background-color: hsl(21, 78%, 59%);
        background-image: url(media/images/sponge.svg);
      }
      #clear-button {
        background-color:hsl(21, 78%, 59%);
        background-image: url(media/images/bomb.svg);
        display: none;
      }

      #selected-emoji {
        position: absolute;
        bottom: -0.1em;
        right: -0.1em;
        width: 1em;
        height: 1em;
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
      }

      #settings-button {
        cursor: pointer;
        position: absolute;
        z-index: 3;
        top: 0.5em;
        right: 0.5em;
        width: 2.25em;
        height: 2.25em;
        padding: 0px;
        margin: 0px;
        border: 0px;
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
        background-image: url(media/images/gear-white.svg);
        background-color: transparent;
        transition: transform 0.5s ease-in-out;
      }
      #settings-button.open {
        transform: rotate(-150deg);
      }

      #emoji-picker-container>button:hover {
        transform: scale(1.3);
      }
      #emoji-picker-container>button.selected {
        transform: scale(1.25);
      }
      emoji-picker {
        margin: auto;
        --emoji-font-family: "Noto Color Emoji", sans-serif
      }

      .tp-dfwv {
        z-index: 10;
        margin-top: 2em;
      }

      .touch-inputs {
        display: none;
        z-index: 2;
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
      }

      .touch-inputs.touchscreen {
        display: block;
      }

      .touch-click-zone {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 33%;
      }
      .left-input-zone {
        position: absolute;
        left: 0;
        right: 50%;
        top: 66%;
        bottom: 0;
      }
      .right-input-zone {
        position: absolute;
        left: 50%;
        right: 0;
        top: 66%;
        bottom: 0;
      }

      .crosshairs {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        z-index: 5;
        margin: auto;
        pointer-events: none;
        background-position: center;
        background-repeat: no-repeat;
      }

      .crosshairs.shoot {
        background-image: url(./media/images/crosshairs.png);
        opacity: 66%;
      }

      .crosshairs.erase {
        background-image: url(./media/images/crosshairs-2.png);
        opacity: 66%;
      }

      .loading canvas {
        display: none;
      }

      .loading-splash {
        display: none;
        position: absolute;
        text-align: center;
        padding-top: 3em;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        z-index: 20;
        margin: auto;
        pointer-events: none;
        background-image: url(./media/images/spinner.gif);
        background-color: white;
        background-position: center;
        background-repeat: no-repeat;
      }

      .loading .loading-splash {
        display: block;
      }
    </style>

    <!-- Enables consistent looking emoji across platforms -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">

  </head>
  <body>
    <script type='module' src='https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js'></script>

    <canvas id='webgpu-canvas'></canvas>

    <div class='crosshairs'></div>

    <div class='touch-inputs'>
      <div class='touch-click-zone'></div>
      <div class='left-input-zone'></div>
      <div class='right-input-zone'></div>
    </div>

    <div id='emoji-picker-container'>
      <button id='view-button'></button>
      <button id='emoji-button'>
        <div id='selected-emoji'>😄</div>
      </button>
      <button id='shoot-button'></button>
      <button id='erase-button'></button>
      <button id='clear-button'></button>

      <emoji-picker emoji-version='18.0' style='display: none'></emoji-picker>
      <div id='decalOptions'>
        <input type="range" id="decalRotation" name="decalRotation" min="-180" max="180" step="15" value="0"/>
        <label for="decalRotation">Decal Rotation</label>
        <input type="checkbox" id="decalFlip" name="decalFlip"/>
        <label for="decalFlip">Flip Horizontal</label>
      </div>
    </div>

    <button id='settings-button'></button>

    <div class='loading-splash'>
      <h1>😄 Emoji Graffiti 🎨</h1>
      <h2>Loading...</h2>
    </div>
    <script type='module' src='./dist/main.js'></script>
  </body>
</html>
